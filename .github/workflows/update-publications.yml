name: Update publications

on:
  schedule:
    # 20:17 UTC Sunday ≈ Monday morning in Sydney. Off-the-hour to dodge
    # GitHub's scheduler congestion at :00.
    - cron: "17 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh publications block from ORCID
        run: python scripts/update_publications.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change — publications block already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh publications from ORCID"
          git push